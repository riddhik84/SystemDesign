spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:strava-test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379   # unused by pure unit tests (repositories/cache are mocked)

app:
  activity:
    moving-speed-threshold-mps: 0.5
    max-batch-points: 1000
  live:
    location-ttl-seconds: 300
  leaderboard:
    default-limit: 10
  segment:
    default-match-radius-meters: 30
