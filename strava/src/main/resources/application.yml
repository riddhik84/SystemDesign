spring:
  application:
    name: strava

  datasource:
    url: jdbc:h2:mem:strava
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms

server:
  port: 8080

app:
  activity:
    moving-speed-threshold-mps: 0.5
    max-batch-points: 1000
  live:
    location-ttl-seconds: 300
  leaderboard:
    default-limit: 10
  segment:
    default-match-radius-meters: 30

logging:
  level:
    com.systemdesign.strava: DEBUG
    org.springframework.web: INFO
